[workspace]
members = ["mock-ft", "mock-mpc"]

[package]
name = "grant-manager"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/kurodenjiro/x402-hack"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
near-workspaces = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
